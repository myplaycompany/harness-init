repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: debug-statements
      - id: check-added-large-files
        args: ["--maxkb=1000"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # 도메인 의미 변화 게이트.
  # Choices/Enum 값, 시그널 배선, db_table 이 바뀌었는데 DOMAIN.md가 함께
  # 갱신되지 않으면 커밋을 막는다. 이 세 가지는 codegraph가 인덱싱하지 못해
  # 문서에 남기지 않으면 지식이 그대로 유실된다.
  # 우회: git commit --no-verify (사유를 PR 설명에 남길 것)
  - repo: local
    hooks:
      - id: domain-gate
        name: DOMAIN.md 의미 변화 게이트
        entry: python3 .claude/scripts/domain-gate.py --staged
        language: system
        pass_filenames: false
        always_run: true
